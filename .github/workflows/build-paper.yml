name: Publish readable research paper PDF
on:
  workflow_dispatch:
  push:
    paths:
      - "paper/AUTHOR_SUPPLIED_MANUSCRIPT_TEXT.md"
      - "tools/pdf_from_manuscript.py"
      - ".github/workflows/build-paper.yml"

permissions:
  contents: write

jobs:
  build-readable-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF generator
        run: python -m pip install reportlab==4.4.4
      - name: Build readable PDF
        run: python tools/pdf_from_manuscript.py
      - name: Commit the generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/AI_Research_Online_Readable_Copy.pdf
          if ! git diff --staged --quiet; then
            git commit -m "Publish accessible PDF manuscript with evidence URL"
            git push
          fi
